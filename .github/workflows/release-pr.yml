name: PR dev vers main

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    env:
      # Même PAT que pour auto-pr.yml (sinon la CI ne se lance pas sur la PR)
      GH_TOKEN: ${{ secrets.PR_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Créer la PR dev -> main si elle n'existe pas
        run: |
          count=$(gh pr list --head dev --base main --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Release : dev → main" \
              --body "PR de release ouverte automatiquement. La merger déclenche le déploiement en production."
          else
            echo "Une PR dev -> main est déjà ouverte"
          fi
