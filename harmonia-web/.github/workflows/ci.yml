name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Vers main, seules les PR venant de dev sont acceptées
  branch-guard:
    name: Branch guard
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Vers main, seules les PR depuis dev sont autorisées (reçu : $HEAD_REF)."
            exit 1
          fi
          echo "OK : $HEAD_REF -> $BASE_REF"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmonia-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harmonia-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Audit des dépendances (non bloquant)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
